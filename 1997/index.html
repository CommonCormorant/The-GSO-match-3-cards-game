
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cards Match 3+</title>
  <link rel="icon" type="image/png" sizes="16x16" href="https://www.gameship.online/info/favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="https://www.gameship.online/info/favicon-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="https://www.gameship.online/info/favicon-48.png">
  <link rel="shortcut icon" href="https://www.gameship.online/info/favicon.ico">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-container">
        <div id="start-screen" class="screen active">
            <h1 class="game-title"><span class="emoji">♦️</span>Suit Scramble<span class="emoji">♣️</span></h1>
            <div class="mode-selection">
                <button class="btn" data-mode="easy">Easy 1️⃣2️⃣0️⃣🆓</button>
                <button class="btn" data-mode="poverty">Poverty 2️⃣0️⃣🆓</button>
                <button class="btn" data-mode="entrepreneur">Entrepreneur 7️⃣🆓</button>
            </div>
            <div class="high-scores-container">
                <h3>🏆 High Scores 🏆</h3>
                <div class="high-scores-columns">
                    <div class="high-score-column">
                        <h4>Easy</h4>
                        <ul id="high-scores-list-easy"></ul>
                    </div>
                    <div class="high-score-column">
                        <h4>Poverty</h4>
                        <ul id="high-scores-list-poverty"></ul>
                    </div>
                    <div class="high-score-column">
                        <h4>Entrepreneur</h4>
                        <ul id="high-scores-list-entrepreneur"></ul>
                    </div>
                </div>
            </div>
        </div>

        <div id="game-screen" class="screen">
            <div id="game-header">
                <div class="stat-display">Score: <span id="score-value">0</span></div>
                <div class="stat-display">Grant: <span id="grant-value">0</span>🆓</div>
            </div>
            <div id="game-board"></div>
             <div id="deck-info" class="stat-display">Cards in Deck: <span id="deck-count">0</span></div>
        </div>

        <div id="game-over-screen" class="screen">
            <h2>🎉 Game Over! 🎉</h2>
            <p id="final-score">Final Score: <span id="final-score-value">0</span></p>
            <h3>🏆 High Scores (<span id="game-mode-display"></span>) 🏆</h3>
            <ul id="high-scores-list">
            </ul>
            <button id="play-again-btn" class="btn">Play Again</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
